# ==========================================
# 1. PC SERVIDOR (VPS / Backend)
# ==========================================
server:
  host: "0.0.0.0"     # IMPORTANTE: 0.0.0.0 permite conexiones externas.
  port: 51820

tunnel:
  host: "0.0.0.0"
  port: 51820
  auth_key: "feqxYc-ilusao"
  tls_cert: "certs/server.pem"
  tls_key: "certs/server.key"
  max_clients: 32
  
# Secrets for HMAC signing (change these in production!)
secrets:
  gateway_secret: "vgc_gateway_secret_change_in_prod"
  auth_key: "vgc_auth_key_2024_change_in_prod"

# ==========================================
# 2. PC CLIENTE (Tu PC Gaming)
# ==========================================
client:
  server_ip: "192.168.1.136"  # Cambia esto por la IP pública de tu VPS o IP de tu servidor
  server_port: 51820

session:
  idle_timeout_sec: 300          # 5 minutos (match VAL 5 timeout)

heartbeat:
  riot_timeout_ms: 3000          # 3 segundos (más rápido)
  waning_threshold_sec: 240      # 4 minutos (antes de VAL 5)
  interval_ms: 10000             # 10 segundos (para prevenir desincronización de token en cola)
  jitter_max_ms: 500             # 0.5 segundos jitter

paths:
  event_log_dir: "logs/sessions"
  fallback_cache: "data/fallback_cache.json"

wine:
  enabled: true
  program_path: "server/program.exe"
  ready_timeout_sec: 30
  ipc_timeout_ms: 5000
  work_dir: "data/containers"

gateway:
  region: "la"
  vanguard_ua: "vanguard/1.18.3-74+20260623.212037"
  build_branch: "release-13.02-shipping-10-5229475"
  build_changelist: 5229475

stealth:
  hwid_rotation: true
  token_jitter_ms: 1500
  fallback_noise: true
